name: Generate Colorful Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate colorful snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=githublight&color_snake=#FF6B6B&color_dots=#ebedf0,#FF6B6B,#FFA94D,#FFD93D,#6BCB77
            dist/github-snake-dark.svg?palette=githubdark&color_snake=#FF6B6B&color_dots=#2d3343,#FF6B6B,#FFA94D,#FFD93D,#6BCB77

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
